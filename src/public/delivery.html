<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rashmi Boutique — Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap"
        rel="stylesheet">
    <script>
        try {
            document.documentElement.setAttribute('data-theme', localStorage.getItem('dashboard-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
        } catch (e) { }
    </script>
    <style>
        /* ===== THEME VARIABLES ===== */
        :root {
            --bg-primary: #0b0f14;
            --bg-secondary: #10161d;
            --bg-card: #121a22;
            --bg-card-hover: #17212b;
            --accent: #2dd4bf;
            --on-accent: #042f2e;
            --accent-glow: rgba(45, 212, 191, 0.14);
            --chart-bar: #0fa898;
            --text-primary: #e6edf3;
            --text-secondary: #a3b1bf;
            --text-muted: #7d8b99;
            --border: rgba(255, 255, 255, 0.08);
            --success: #4ade80;
            --warning: #fbbf24;
            --info: #60a5fa;
            --danger: #f87171;
            --violet: #a78bfa;
            --cyan: #22d3ee;
            --input-bg: rgba(255, 255, 255, 0.04);
            --sidebar-bg: #0d1218;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
            --shadow-hover: 0 6px 18px rgba(0, 0, 0, 0.45);
        }

        [data-theme="light"] {
            --bg-primary: #f4f6f8;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-card-hover: #f9fafb;
            --accent: #0f766e;
            --on-accent: #ffffff;
            --accent-glow: rgba(15, 118, 110, 0.1);
            --chart-bar: #0d9488;
            --text-primary: #101828;
            --text-secondary: #475467;
            --text-muted: #667085;
            --border: #e4e7ec;
            --success: #067647;
            --warning: #b54708;
            --info: #1d4ed8;
            --danger: #b42318;
            --violet: #6d28d9;
            --cyan: #0e7090;
            --input-bg: #f2f4f7;
            --sidebar-bg: #ffffff;
            --shadow: 0 1px 2px rgba(16, 24, 40, 0.06), 0 1px 3px rgba(16, 24, 40, 0.04);
            --shadow-hover: 0 8px 20px rgba(16, 24, 40, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            transition: background 0.3s, color 0.3s;
            display: flex;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            width: 240px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            display: flex;
            flex-direction: column;
            transition: background 0.3s, border 0.3s;
            z-index: 200;
        }

        .sidebar-brand {
            padding: 1.5rem 1.25rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .sidebar-brand .logo-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 600;
            font-size: 1.05rem;
            color: var(--on-accent);
            flex-shrink: 0;
        }

        .sidebar-brand .brand-text {
            font-family: 'Fraunces', Georgia, serif;
            font-weight: 600;
            font-size: 1.02rem;
            line-height: 1.2;
        }

        .sidebar-brand .brand-sub {
            font-size: 0.68rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        .sidebar-nav {
            flex: 1;
            padding: 1rem 0;
        }

        .sidebar-nav .nav-label {
            padding: 0.5rem 1.25rem;
            font-size: 0.65rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-muted);
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            padding: 0.7rem 1.25rem;
            margin: 0.15rem 0.6rem;
            border-radius: 10px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-secondary);
            transition: all 0.2s;
            border: none;
            background: none;
            width: calc(100% - 1.2rem);
            text-align: left;
            font-family: 'Inter', sans-serif;
        }

        .nav-item:hover {
            background: var(--input-bg);
            color: var(--text-primary);
        }

        .nav-item.active {
            background: var(--accent-glow);
            color: var(--accent);
            font-weight: 600;
        }

        .nav-item .nav-icon {
            width: 20px;
            text-align: center;
            font-size: 1rem;
        }

        .sidebar-footer {
            padding: 1rem 1.25rem;
            border-top: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .sidebar-footer .admin-name {
            font-size: 0.78rem;
            font-weight: 600;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .sidebar-footer .admin-email {
            font-size: 0.68rem;
            color: var(--text-muted);
        }

        /* ===== TOP BAR ===== */
        .topbar {
            height: 64px;
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
            transition: background 0.3s;
        }

        .topbar .page-title {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .topbar .top-right {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.78rem;
            color: var(--text-secondary);
        }

        .status-indicator .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--success);
            animation: pulse 2s infinite;
        }

        .icon-btn {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
            width: 38px;
            height: 38px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .icon-btn:hover {
            background: var(--accent-glow);
            color: var(--accent);
            border-color: var(--accent);
        }

        .logout-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s;
        }

        .logout-btn:hover {
            background: color-mix(in srgb, var(--danger) 12%, transparent);
            border-color: color-mix(in srgb, var(--danger) 45%, transparent);
            color: var(--danger);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1
            }

            50% {
                opacity: 0.4
            }
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-left: 240px;
            flex: 1;
            min-width: 0; /* let wide tables scroll inside their card instead of widening the page */
            min-height: 100vh;
        }

        .content-area {
            padding: 1.5rem 2rem;
            max-width: 1320px;
        }

        /* ===== STATS ===== */
        .stats-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 1.25rem;
            box-shadow: var(--shadow);
            transition: box-shadow 0.2s;
            position: relative;
            overflow: hidden;
        }

        .stat-card::before {
            display: none;
        }

        .stat-card.c1::before {
            background: var(--accent);
        }

        .stat-card.c2::before {
            background: var(--info);
        }

        .stat-card.c3::before {
            background: var(--success);
        }

        .stat-card.c4::before {
            background: var(--warning);
        }

        .stat-card.c5::before {
            background: var(--violet);
        }

        .stat-card:hover {
            box-shadow: var(--shadow-hover);
        }

        .stat-card .stat-label {
            font-size: 0.72rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            margin-bottom: 0.5rem;
        }

        .stat-card .stat-value {
            font-size: 1.75rem;
            font-weight: 700;
        }

        /* ===== TABLE ===== */
        .table-container {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 14px;
            overflow-x: auto;
            overflow-y: hidden;
            transition: background 0.3s;
        }

        .table-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .table-header h2 {
            font-size: 1rem;
            font-weight: 600;
        }

        .refresh-btn {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.4rem 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .refresh-btn:hover {
            background: var(--accent-glow);
            color: var(--accent);
            border-color: var(--accent);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead th {
            text-align: left;
            padding: 0.75rem 1.25rem;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.07em;
            color: var(--text-muted);
            border-bottom: 1px solid var(--border);
            background: var(--input-bg);
        }

        tbody tr {
            transition: background 0.2s;
        }

        tbody tr:hover {
            background: var(--bg-card-hover);
        }

        tbody td {
            padding: 0.75rem 1.25rem;
            font-size: 0.82rem;
            border-bottom: 1px solid var(--border);
            color: var(--text-secondary);
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* ===== STATUS BADGES ===== */
        .badge {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.65rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            white-space: nowrap;
        }

        .badge.order_received {
            background: color-mix(in srgb, var(--info) 14%, transparent);
            color: var(--info);
        }

        .badge.in_stitching {
            background: color-mix(in srgb, var(--violet) 14%, transparent);
            color: var(--violet);
        }

        .badge.ready {
            background: color-mix(in srgb, var(--warning) 16%, transparent);
            color: var(--warning);
        }

        .badge.out_for_delivery {
            background: color-mix(in srgb, var(--cyan) 14%, transparent);
            color: var(--cyan);
        }

        .badge.delivered {
            background: color-mix(in srgb, var(--success) 14%, transparent);
            color: var(--success);
        }

        .badge.cancelled {
            background: color-mix(in srgb, var(--danger) 14%, transparent);
            color: var(--danger);
        }

        /* ===== STATUS DROPDOWN ===== */
        .status-select {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.3rem 0.5rem;
            border-radius: 6px;
            font-size: 0.75rem;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: border 0.2s;
            outline: none;
        }

        .status-select:focus {
            border-color: var(--accent);
        }

        .status-select option {
            background: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* ===== ACTION BUTTONS ===== */
        .action-btn {
            background: var(--input-bg);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 0.3rem 0.6rem;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.72rem;
            font-family: 'Inter', sans-serif;
            transition: all 0.2s;
            white-space: nowrap;
        }

        .action-btn:hover {
            background: var(--accent-glow);
            color: var(--accent);
            border-color: var(--accent);
        }

        .actions-cell {
            white-space: nowrap;
        }

        .actions-cell .action-btn {
            margin-right: 4px;
        }

        .search-input {
            padding: 0.45rem 0.9rem;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            outline: none;
            width: 280px;
            transition: border 0.2s, box-shadow 0.2s;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px var(--accent-glow);
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .map-link {
            color: var(--accent);
            text-decoration: none;
            font-weight: 500;
            font-size: 0.8rem;
        }

        .map-link:hover {
            text-decoration: underline;
        }

        /* ===== ANALYTICS (BOLD REDESIGN) ===== */
        .analytics-kpi-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .kpi-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }

        .kpi-card::after {
            display: none;
        }

        .kpi-card.k1::after {
            background: var(--accent);
        }

        .kpi-card.k2::after {
            background: var(--info);
        }

        .kpi-card.k3::after {
            background: var(--success);
        }

        .kpi-card.k4::after {
            background: var(--violet);
        }

        .kpi-card .kpi-icon {
            font-size: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .kpi-card .kpi-value {
            font-size: 2rem;
            font-weight: 800;
            line-height: 1;
            margin-bottom: 0.35rem;
        }

        .kpi-card.k1 .kpi-value {
            color: var(--accent);
        }

        .kpi-card.k2 .kpi-value {
            color: var(--text-primary);
        }

        .kpi-card.k3 .kpi-value {
            color: var(--text-primary);
        }

        .kpi-card.k4 .kpi-value {
            color: var(--text-primary);
        }

        .kpi-card .kpi-label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.06em;
            font-weight: 600;
        }

        .analytics-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 1.25rem;
        }

        .chart-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            box-shadow: var(--shadow);
        }

        .chart-card h3 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .bar-rank {
            width: 24px;
            height: 24px;
            border-radius: 6px;
            background: var(--input-bg);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.7rem;
            font-weight: 700;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .bar-label {
            width: 140px;
            font-size: 0.82rem;
            font-weight: 500;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .bar-track {
            flex: 1;
            height: 12px;
            background: var(--input-bg);
            border-radius: 4px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            border-radius: 0 4px 4px 0;
            background: var(--chart-bar);
            transition: width 1s cubic-bezier(0.22, 1, 0.36, 1);
        }

        .bar-fill.c1 {
            background: var(--chart-bar);
        }

        .bar-fill.c2 {
            background: var(--chart-bar);
        }

        .bar-fill.c3 {
            background: var(--chart-bar);
        }

        .bar-fill.c4 {
            background: var(--chart-bar);
        }

        .bar-fill.c5 {
            background: var(--chart-bar);
        }

        .bar-count {
            width: 28px;
            text-align: right;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--text-primary);
            flex-shrink: 0;
        }

        .bar-pct {
            font-size: 0.75rem;
            font-weight: 600;
            color: var(--text-muted);
            width: 45px;
            text-align: right;
            flex-shrink: 0;
        }

        /* Status distribution */
        .status-dist {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .status-dist-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            background: var(--input-bg);
            border-radius: 10px;
        }

        .status-dist-item .sdi-label {
            font-size: 0.82rem;
            font-weight: 500;
        }

        .status-dist-item .sdi-count {
            font-size: 1.1rem;
            font-weight: 800;
        }

        .status-dist-item.order_received .sdi-count {
            color: var(--info);
        }

        .status-dist-item.out_for_delivery .sdi-count {
            color: var(--cyan);
        }

        .status-dist-item.delivered .sdi-count {
            color: var(--success);
        }

        .status-dist-item.cancelled .sdi-count {
            color: var(--danger);
        }

        /* ===== EMPTY/LOADING ===== */
        .empty-state {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-muted);
        }

        .empty-state p {
            font-size: 0.9rem;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 3rem;
        }

        .spinner {
            width: 28px;
            height: 28px;
            border: 3px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 0.75rem 1.25rem;
            box-shadow: var(--shadow-hover);
            z-index: 1000;
            font-size: 0.85rem;
            color: var(--text-primary);
            transform: translateY(100px);
            opacity: 0;
            transition: all 0.3s;
        }

        .toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        .toast.success {
            border-left: 4px solid var(--success);
        }

        .toast.error {
            border-left: 4px solid var(--danger);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 900px) {
            .analytics-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }

            .main-content {
                margin-left: 0;
            }

            .content-area {
                padding: 1rem;
            }

            .stats-row {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.6rem;
            }

            .stat-card {
                padding: 1rem;
            }

            .stat-card .stat-value {
                font-size: 1.4rem;
            }

            thead th,
            tbody td {
                padding: 0.5rem 0.6rem;
                font-size: 0.72rem;
            }

            .analytics-kpi-row {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>

<body>
    <!-- Sidebar -->
    <aside class="sidebar">
        <div class="sidebar-brand">
            <div class="logo-icon">RB</div>
            <div>
                <div class="brand-text">Rashmi Boutique</div>
                <div class="brand-sub">Delivery Panel</div>
            </div>
        </div>

        <nav class="sidebar-nav">
            <div class="nav-label">Main Menu</div>
            <button class="nav-item active" id="nav-orders">
                Orders
            </button>
        </nav>

        <div class="sidebar-footer">
            <div>
                <div class="admin-name" id="adminName">Admin</div>
                <div class="admin-email" id="adminEmail">admin@rashmiboutique</div>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <div class="main-content">
        <!-- Top Bar -->
        <div class="topbar">
            <div class="page-title" id="pageTitle">Orders</div>
            <div class="top-right">
                <div class="status-indicator">
                    <div class="dot"></div><span>System Active</span>
                </div>
                <button class="icon-btn" id="themeToggle" onclick="toggleTheme()" title="Toggle Theme">&#9790;</button>
                <button class="logout-btn" onclick="handleLogout()">Logout</button>
            </div>
        </div>

        <div class="content-area">
            <!-- Stats -->
            <div class="stats-row" style="grid-template-columns: repeat(3, 1fr);">
                <div class="stat-card c1">
                    <div class="stat-label">Total Orders</div>
                    <div class="stat-value" id="totalOrders">&mdash;</div>
                </div>
                <div class="stat-card c3">
                    <div class="stat-label">Delivered</div>
                    <div class="stat-value" id="deliveredOrders">&mdash;</div>
                </div>
                <div class="stat-card c4">
                    <div class="stat-label">In Progress</div>
                    <div class="stat-value" id="activeOrders">&mdash;</div>
                </div>
            </div>

            <!-- Orders Section -->
            <div id="ordersSection" class="table-container">
                <div class="table-header">
                    <h2>Order Management</h2>
                    <div style="display:flex; align-items:center; gap:0.6rem;">
                        <input type="text" id="orderSearch" class="search-input"
                            placeholder="Search by name, phone, or order ID..." oninput="filterOrders()">
                        <button class="refresh-btn" onclick="loadData()">Refresh</button>
                    </div>
                </div>
                <div id="ordersTableBody">
                    <div class="loading">
                        <div class="spinner"></div>
                    </div>
                </div>
            </div>

            <!-- (Removed Sections) -->
        </div>
    </div>

    <!-- Toast -->
    <div class="toast" id="toast"></div>

    <script>
        // Same order journey as src/services/orderUpdates.ts
        const STATUS_OPTIONS = [
            { value: 'order_received', label: 'Booked' },
            { value: 'in_stitching', label: 'Stitching in Progress' },
            { value: 'ready', label: 'Outfit Ready' },
            { value: 'out_for_delivery', label: 'Out for Delivery' },
            { value: 'delivered', label: 'Delivered' },
            { value: 'cancelled', label: 'Cancelled' }
        ];
        const CLOSED_STATUSES = ['delivered', 'cancelled'];

        let ordersData = [];

        // ===== AUTH CHECK =====
        const TOKEN = localStorage.getItem('admin_token');
        if (!TOKEN) window.location.href = '/login';

        function handleLogout() {
            localStorage.removeItem('admin_token');
            localStorage.removeItem('admin_name');
            localStorage.removeItem('admin_role');
            window.location.href = '/login';
        }

        // Every API call carries the login; an expired login goes back to the sign-in page
        async function api(path, options = {}) {
            const res = await fetch(path, { ...options, headers: { ...(options.headers || {}), 'Authorization': 'Bearer ' + TOKEN } });
            if (res.status === 401) { handleLogout(); throw new Error('Please sign in again.'); }
            const data = await res.json().catch(() => ({}));
            if (!res.ok) throw new Error(data.error || 'Something went wrong.');
            return data;
        }

        (async () => {
            try {
                const res = await fetch('/auth/verify', { headers: { 'Authorization': 'Bearer ' + TOKEN } });
                if (!res.ok) { handleLogout(); return; }
                const data = await res.json();
                document.getElementById('adminName').textContent = data.name || 'Staff';
                document.getElementById('adminEmail').textContent = data.username || '';
            } catch (e) { window.location.href = '/login'; }
        })();

        // Names and addresses come from customers, so escape them before showing them
        function esc(value) {
            return String(value ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
        }
        const arg = value => esc(JSON.stringify(String(value)));
        const shortId = o => o.order_id ? o.order_id.split('-')[0].toUpperCase() : '—';
        const statusLabel = value => (STATUS_OPTIONS.find(s => s.value === value) || {}).label || value;

        // ===== THEME =====
        function setTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            localStorage.setItem('dashboard-theme', theme);
            document.getElementById('themeToggle').innerHTML = theme === 'dark' ? '&#9790;' : '&#9728;';
        }
        function toggleTheme() {
            const current = document.documentElement.getAttribute('data-theme') || 'dark';
            setTheme(current === 'dark' ? 'light' : 'dark');
        }
        setTheme(localStorage.getItem('dashboard-theme') || (window.matchMedia && matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));

        // ===== TOAST =====
        function showToast(msg, type = 'success') {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.className = 'toast ' + type + ' show';
            setTimeout(() => t.classList.remove('show'), 3000);
        }

        // ===== STATUS UPDATE =====
        async function updateStatus(orderId, select) {
            const order = ordersData.find(o => o.order_id === orderId);
            if (!order || !confirm(`Change ${shortId(order)} to "${statusLabel(select.value)}"? The customer will get a WhatsApp update.`)) {
                if (order) select.value = order.status;
                return;
            }
            try {
                const data = await api(`/api/orders/${encodeURIComponent(orderId)}/status`, {
                    method: 'PATCH',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ status: select.value })
                });
                if (data.notified) showToast('Status updated. Customer notified via WhatsApp.');
                else showToast('Status updated, but the WhatsApp message could not be sent.', 'error');
                loadData();
            } catch (e) {
                select.value = order.status;
                showToast(e.message, 'error');
            }
        }

        // ===== RENDER ORDERS (COMPACT + EXPANDABLE) =====
        const openDetails = new Set();

        function renderOrders(orders) {
            const c = document.getElementById('ordersTableBody');
            if (!orders.length) { c.innerHTML = '<div class="empty-state"><p>No orders found.</p></div>'; return; }
            let html = `<table><thead><tr>
                <th>Order ID</th><th>Customer</th><th>Service</th><th>Appointment</th><th>Status</th>
                <th>Update Status</th>
            </tr></thead><tbody>`;
            orders.forEach(o => {
                const id = o.order_id;
                const pickup = o.appointment_type === 'pickup';
                const mapUrl = (o.latitude && o.longitude) ? `https://www.google.com/maps?q=${Number(o.latitude)},${Number(o.longitude)}` : '';
                const options = STATUS_OPTIONS.map(s => `<option value="${s.value}" ${s.value === o.status ? 'selected' : ''}>${s.label}</option>`).join('');
                html += `<tr style="cursor:pointer;" onclick="toggleOrderDetail(${arg(id)})">
                    <td><strong>${esc(shortId(o))}</strong></td>
                    <td>${esc(o.customer_name || '—')}</td>
                    <td style="max-width:160px;">${esc(o.service)}</td>
                    <td style="white-space:nowrap;">${esc(o.booking_date)}<br>${esc(o.booking_time)}<br>${pickup ? 'Home pickup' : 'Boutique visit'}</td>
                    <td><span class="badge ${esc(o.status)}">${esc(statusLabel(o.status))}</span></td>
                    <td onclick="event.stopPropagation();"><select class="status-select" onchange="updateStatus(${arg(id)}, this)">${options}</select></td>
                </tr>
                <tr id="${esc('orderDetail-' + id)}" style="display:${openDetails.has(id) ? 'table-row' : 'none'};">
                    <td colspan="6" style="padding:0.8rem 1.25rem;background:var(--input-bg);border-bottom:1px solid var(--border);">
                        <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0.6rem;font-size:0.78rem;">
                            <div><span style="color:var(--text-muted);">Phone:</span> <a href="tel:+${esc(o.customer_phone)}" class="map-link">+${esc(o.customer_phone)}</a></div>
                            <div><span style="color:var(--text-muted);">Date:</span> <strong>${esc(o.booking_date)}</strong></div>
                            <div><span style="color:var(--text-muted);">Time:</span> <strong>${esc(o.booking_time)}</strong></div>
                            <div><span style="color:var(--text-muted);">Address:</span> <strong>${esc(o.address || (pickup ? '—' : 'Visit to boutique'))}</strong></div>
                            <div><span style="color:var(--text-muted);">Location:</span> ${mapUrl ? `<a href="${mapUrl}" target="_blank" rel="noopener" class="map-link">View Map</a>` : '—'}</div>
                        </div>
                    </td>
                </tr>`;
            });
            html += '</tbody></table>';
            c.innerHTML = html;
        }

        function toggleOrderDetail(id) {
            const el = document.getElementById('orderDetail-' + id);
            if (!el) return;
            const show = el.style.display === 'none';
            el.style.display = show ? 'table-row' : 'none';
            if (show) openDetails.add(id); else openDetails.delete(id);
        }

        // ===== SEARCH / FILTER ORDERS =====
        function filterOrders() {
            const query = document.getElementById('orderSearch').value.toLowerCase().trim();
            if (!query) { renderOrders(ordersData); return; }
            const filtered = ordersData.filter(o => {
                return (o.customer_name || '').toLowerCase().includes(query)
                    || (o.customer_phone || '').includes(query)
                    || shortId(o).toLowerCase().includes(query)
                    || (o.service || '').toLowerCase().includes(query);
            });
            renderOrders(filtered);
        }

        // ===== LOAD DATA =====
        async function loadData() {
            try {
                ordersData = await api('/api/orders');

                // Don't redraw the table under someone who is choosing a status
                const choosing = document.activeElement && document.activeElement.closest && document.activeElement.closest('#ordersTableBody select');
                if (!choosing) filterOrders();

                // Delivery stat updates
                document.getElementById('totalOrders').textContent = ordersData.length;
                document.getElementById('deliveredOrders').textContent = ordersData.filter(o => o.status === 'delivered').length;
                document.getElementById('activeOrders').textContent = ordersData.filter(o => !CLOSED_STATUSES.includes(o.status)).length;

            } catch (e) { console.error('Load error:', e); }
        }

        loadData();
        setInterval(loadData, 15000);
    </script>
</body>

</html>

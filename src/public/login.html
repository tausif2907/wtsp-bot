<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login — Rashmi Boutique</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap"
        rel="stylesheet">
    <script>
        // Same light/dark choice as the dashboard: the saved one, else the computer's setting
        try {
            document.documentElement.setAttribute('data-theme', localStorage.getItem('dashboard-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
        } catch (e) { }
    </script>
    <style>
        :root {
            --bg: #0b0f14;
            --card: #121a22;
            --text: #e6edf3;
            --text-secondary: #a3b1bf;
            --muted: #7d8b99;
            --border: rgba(255, 255, 255, 0.08);
            --input-bg: rgba(255, 255, 255, 0.04);
            --accent: #2dd4bf;
            --on-accent: #042f2e;
            --accent-glow: rgba(45, 212, 191, 0.16);
            --danger: #f87171;
            --success: #4ade80;
            --shadow: 0 20px 50px rgba(0, 0, 0, 0.45);
        }

        [data-theme="light"] {
            --bg: #f4f6f8;
            --card: #ffffff;
            --text: #101828;
            --text-secondary: #475467;
            --muted: #667085;
            --border: #e4e7ec;
            --input-bg: #f9fafb;
            --accent: #0f766e;
            --on-accent: #ffffff;
            --accent-glow: rgba(15, 118, 110, 0.12);
            --danger: #b42318;
            --success: #067647;
            --shadow: 0 12px 32px rgba(16, 24, 40, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 0;
            background: var(--bg);
            color: var(--text);
        }

        /* A soft teal wash behind the card */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: radial-gradient(ellipse at 50% 0%, var(--accent-glow) 0%, transparent 60%);
            z-index: 0;
            pointer-events: none;
        }

        .login-container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 420px;
            padding: 0 1rem;
        }

        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 2.25rem;
            box-shadow: var(--shadow);
        }

        .login-header {
            text-align: center;
            margin-bottom: 1.75rem;
        }

        .login-header .logo {
            width: 54px;
            height: 54px;
            border-radius: 15px;
            background: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Fraunces', Georgia, serif;
            font-size: 1.35rem;
            font-weight: 600;
            color: var(--on-accent);
            margin: 0 auto 1rem;
        }

        .login-header h1 {
            font-family: 'Fraunces', Georgia, serif;
            font-size: 1.55rem;
            font-weight: 600;
            margin-bottom: 0.35rem;
        }

        .login-header p {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .form-group {
            margin-bottom: 1.1rem;
        }

        .form-group label {
            display: block;
            font-size: 0.74rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            color: var(--text-secondary);
            margin-bottom: 0.4rem;
        }

        .form-group input {
            width: 100%;
            padding: 0.75rem 0.95rem;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--text);
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .form-group input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .form-group input::placeholder {
            color: var(--muted);
        }

        .submit-btn {
            width: 100%;
            padding: 0.8rem;
            background: var(--accent);
            border: none;
            border-radius: 10px;
            color: var(--on-accent);
            font-family: 'Inter', sans-serif;
            font-size: 0.92rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 0.5rem;
            transition: filter 0.2s, transform 0.1s;
        }

        .submit-btn:hover {
            filter: brightness(1.08);
        }

        .submit-btn:active {
            transform: translateY(1px);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .switch-mode {
            text-align: center;
            margin-top: 1.25rem;
            font-size: 0.82rem;
            color: var(--text-secondary);
        }

        .switch-mode a {
            color: var(--accent);
            cursor: pointer;
            font-weight: 600;
            text-decoration: none;
        }

        .switch-mode a:hover {
            text-decoration: underline;
        }

        .error-msg,
        .success-msg {
            border-radius: 10px;
            padding: 0.65rem 0.9rem;
            font-size: 0.82rem;
            margin-bottom: 1rem;
            display: none;
        }

        .error-msg {
            background: color-mix(in srgb, var(--danger) 10%, transparent);
            border: 1px solid color-mix(in srgb, var(--danger) 30%, transparent);
            color: var(--danger);
        }

        .success-msg {
            background: color-mix(in srgb, var(--success) 10%, transparent);
            border: 1px solid color-mix(in srgb, var(--success) 30%, transparent);
            color: var(--success);
        }

        /* Fields only shown while creating the first admin account */
        .setup-only {
            display: none;
        }

        .setup-mode .setup-only {
            display: block;
        }

        .setup-note {
            background: var(--accent-glow);
            border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
            border-radius: 10px;
            padding: 0.7rem 0.9rem;
            font-size: 0.8rem;
            line-height: 1.5;
            color: var(--text);
            margin-bottom: 1.1rem;
        }

        .show-password {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 0.6rem;
        }

        .show-password input[type="checkbox"] {
            width: 14px;
            height: 14px;
            accent-color: var(--accent);
            cursor: pointer;
            margin: 0;
            flex-shrink: 0;
        }

        .show-password label {
            font-size: 0.8rem;
            color: var(--text-secondary);
            cursor: pointer;
            user-select: none;
            text-transform: none;
            letter-spacing: 0;
            font-weight: 400;
            margin-bottom: 0;
        }
    </style>
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="logo">RB</div>
                <h1 id="formTitle">Welcome Back</h1>
                <p id="formSubtitle">Sign in to your admin dashboard</p>
            </div>

            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>

            <form id="authForm" onsubmit="handleSubmit(event)">
                <div class="setup-only setup-note">First-time setup: create the boutique's admin account. The setup
                    code is shown in the window where the bot is running.</div>
                <div class="form-group setup-only">
                    <label for="setupCodeInput">Setup code</label>
                    <input type="text" id="setupCodeInput" placeholder="e.g. 7KQM-4XPA" autocomplete="off">
                </div>
                <div class="form-group setup-only">
                    <label for="nameInput">Your name</label>
                    <input type="text" id="nameInput" placeholder="e.g. Rashmi" autocomplete="name">
                </div>
                <div class="form-group">
                    <label>Username</label>
                    <input type="text" id="usernameInput" placeholder="Enter username" required autocomplete="username">
                </div>
                <div class="form-group">
                    <label>Password</label>
                    <input type="password" id="passwordInput" placeholder="Enter your password" required minlength="6"
                        autocomplete="current-password">
                    <div class="setup-only" style="font-size:0.76rem;color:var(--muted);margin-top:0.4rem;">At least 8
                        characters.</div>
                    <div class="show-password">
                        <input type="checkbox" id="showPasswordCheck" onchange="togglePasswordVisibility()">
                        <label for="showPasswordCheck">Show Password</label>
                    </div>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">Sign In</button>
            </form>
        </div>
    </div>

    <script>
        function togglePasswordVisibility() {
            const pw = document.getElementById('passwordInput');
            pw.type = document.getElementById('showPasswordCheck').checked ? 'text' : 'password';
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('successMsg').style.display = 'none';
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';
        }

        // While the bot's database has no admin yet, this page creates the first one
        let setupMode = false;
        const buttonLabel = () => (setupMode ? 'Create Admin Account' : 'Sign In');

        function showSetup() {
            setupMode = true;
            document.getElementById('authForm').classList.add('setup-mode');
            document.getElementById('formTitle').textContent = 'Set Up Your Dashboard';
            document.getElementById('formSubtitle').textContent = 'Create the admin account for Rashmi Boutique';
            document.getElementById('passwordInput').setAttribute('minlength', '8');
            document.getElementById('passwordInput').setAttribute('autocomplete', 'new-password');
            document.getElementById('setupCodeInput').required = true;
            document.getElementById('nameInput').required = true;
            document.getElementById('submitBtn').textContent = buttonLabel();
        }

        async function handleSubmit(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = setupMode ? 'Creating account...' : 'Signing in...';

            const username = document.getElementById('usernameInput').value.trim();
            const password = document.getElementById('passwordInput').value;
            const body = setupMode
                ? { username, password, name: document.getElementById('nameInput').value.trim(), setupCode: document.getElementById('setupCodeInput').value.trim() }
                : { username, password };

            try {
                const res = await fetch(setupMode ? '/auth/signup' : '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();

                if (!res.ok) {
                    showError(data.error || 'Something went wrong.');
                    btn.disabled = false;
                    btn.textContent = buttonLabel();
                    return;
                }

                localStorage.setItem('admin_token', data.token);
                localStorage.setItem('admin_name', data.name);
                localStorage.setItem('admin_role', data.role || 'admin');

                showSuccess(setupMode ? 'Admin account created! Opening your dashboard...' : 'Login successful! Redirecting...');

                setTimeout(() => {
                    if (data.role === 'delivery') {
                        window.location.href = '/delivery';
                    } else {
                        window.location.href = '/dashboard';
                    }
                }, 800);
            } catch (err) {
                showError('Network error. Please try again.');
                btn.disabled = false;
                btn.textContent = buttonLabel();
            }
        }

        // Auto login if token exists and is valid
        window.onload = async () => {
            try {
                const setup = await (await fetch('/auth/setup')).json();
                if (setup.needed) {
                    localStorage.removeItem('admin_token');
                    showSetup();
                    return;
                }
            } catch (e) { }

            const token = localStorage.getItem('admin_token');
            if (token) {
                try {
                    const res = await fetch('/auth/verify', { headers: { 'Authorization': 'Bearer ' + token } });
                    const data = await res.json();
                    if (data.valid) {
                        localStorage.setItem('admin_role', data.role || 'admin');
                        if (data.role === 'delivery') {
                            window.location.href = '/delivery';
                        } else {
                            window.location.href = '/dashboard';
                        }
                    } else {
                        localStorage.removeItem('admin_token');
                        localStorage.removeItem('admin_role');
                    }
                } catch (e) { }
            }
        };
    </script>
</body>

</html>
